[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# API routes must win over the SPA fallback.
[[redirects]]
  from = "/waitlist"
  to = "/.netlify/functions/waitlist"
  status = 200
  force = true

[[redirects]]
  from = "/live"
  to = "/.netlify/functions/live"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
